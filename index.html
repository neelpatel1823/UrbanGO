<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>UrbanPulse</title>

    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <header class="navbar">
      <a class="brand" href="index.html">
        Urban<span>Pulse</span>
      </a>

      <nav>
        <a href="index.html">Home</a>
        <a data-report-link href="login.html">Report Problem</a>
        <a href="problems.html">Problems</a>
        <a href="login.html">Login</a>
      </nav>
    </header>

    <main class="hero">
      <div class="hero-content">
        <p class="eyebrow">Community reporting</p>

        <h1>
          Report problems.<br>
          Improve your community.
        </h1>

        <p>
          Raise local civic issues and make them visible
          to the people who can help.
        </p>

        <div class="actions">
          <a
            class="btn btn-primary"
            data-report-link
            href="login.html"
          >
            Report a Problem
          </a>

          <a
            class="btn btn-secondary"
            href="problems.html"
          >
            View Problems
          </a>
        </div>
      </div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
