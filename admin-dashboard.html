<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dashboard | UrbanPulse</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="admin-sidebar">
      <div class="sidebar-brand">
        <span class="brand">Urban<span>Pulse</span></span>
        <small>Admin</small>
      </div>
      <nav class="sidebar-nav">
        <a href="admin-dashboard.html" class="active"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Dashboard</a>
        <a href="admin-reports.html"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>Reports</a>
        <a href="admin-users.html"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Users</a>
        <a href="admin-settings.html"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Settings</a>
      </nav>
      <div class="sidebar-footer">
        <a href="index.html" class="btn btn-secondary btn-sm">← Back to Site</a>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
      <header class="admin-header">
        <div class="header-left">
          <h1>Dashboard</h1>
          <p class="subtitle">Overview of reported civic issues</p>
        </div>
        <div class="header-right">
          <span class="admin-badge">Administrator</span>
        </div>
      </header>

      <!-- Stats Cards -->
      <section class="admin-stats-grid">
        <article class="stat-card">
          <div class="stat-icon total"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
          <div class="stat-info">
            <p class="stat-value" id="stat-total">0</p>
            <p class="stat-label">Total Reports</p>
          </div>
        </article>
        <article class="stat-card">
          <div class="stat-icon pending"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>
          <div class="stat-info">
            <p class="stat-value" id="stat-pending">0</p>
            <p class="stat-label">Pending Review</p>
          </div>
        </article>
        <article class="stat-card">
          <div class="stat-icon progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div>
          <div class="stat-info">
            <p class="stat-value" id="stat-progress">0</p>
            <p class="stat-label">In Progress</p>
          </div>
        </article>
        <article class="stat-card">
          <div class="stat-icon resolved"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg></div>
          <div class="stat-info">
            <p class="stat-value" id="stat-resolved">0</p>
            <p class="stat-label">Resolved</p>
          </div>
        </article>
      </section>

      <!-- Recent Reports Table -->
      <section class="admin-panel">
        <div class="panel-head">
          <h2>Recent Reports</h2>
          <a href="admin-reports.html" class="btn btn-primary btn-sm">View All</a>
        </div>
        <div class="table-wrapper">
          <table class="admin-table" id="reports-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Type</th>
                <th>Location</th>
                <th>Priority</th>
                <th>Status</th>
                <th>Reporter</th>
                <th>Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script>
    (function() {
      const user = JSON.parse(localStorage.getItem('urbanpulseUser') || 'null');
      if (!user || user.role !== 'admin') {
        location.href = 'admin-login.html';
        return;
      }
      // Load recent reports via API
      async function loadReports() {
        try {
          const res = await fetch('/api/reports');
          const { reports } = await res.json();
          renderStats(reports);
          renderTable(reports.slice(0, 10));
        } catch (e) {
          console.error(e);
        }
      }

      function renderStats(reports) {
        const totals = reports.reduce((acc, r) => {
          acc.total++;
          const s = (r.status || '').toLowerCase();
          if (s === 'submitted' || s === 'pending') acc.pending++;
          else if (s === 'in progress' || s === 'in-progress') acc.progress++;
          else if (s === 'resolved') acc.resolved++;
          return acc;
        }, { total:0, pending:0, progress:0, resolved:0 });

        document.getElementById('stat-total').textContent = totals.total;
        document.getElementById('stat-pending').textContent = totals.pending;
        document.getElementById('stat-progress').textContent = totals.progress;
        document.getElementById('stat-resolved').textContent = totals.resolved;
      }

      function renderTable(reports) {
        const tbody = document.querySelector('#reports-table tbody');
        tbody.innerHTML = reports.map(r => `
          <tr>
            <td>${escapeHtml(r.id)}</td>
            <td><span class="tag">${escapeHtml(r.type)}</span></td>
            <td>${escapeHtml(r.location)}</td>
            <td><span class="priority ${(r.priority||'').toLowerCase()}">${escapeHtml(r.priority)}</span></td>
            <td><span class="status-badge ${(r.status||'').toLowerCase().replace(' ', '-')}">${escapeHtml(r.status)}</span></td>
            <td>${escapeHtml(r.reporter)}</td>
            <td>${escapeHtml(r.createdAt)}</td>
            <td>
              <select class="status-select" data-id="${escapeHtml(r.id)}">
                <option value="Submitted" ${r.status==='Submitted'?'selected':''}>Submitted</option>
                <option value="In Progress" ${r.status==='In Progress'?'selected':''}>In Progress</option>
                <option value="Resolved" ${r.status==='Resolved'?'selected':''}>Resolved</option>
              </select>
            </td>
          </tr>`).join('');

        // attach change listeners
        tbody.querySelectorAll('.status-select').forEach(sel => {
          sel.addEventListener('change', async e => {
            const id = e.target.dataset.id;
            const newStatus = e.target.value;
            await fetch(`/api/reports/${id}`, {
              method: 'PATCH',
              headers: {'Content-Type':'application/json'},
              body: JSON.stringify({ status: newStatus })
            });
            loadReports(); // refresh
          });
        });
      }

      function escapeHtml(str) {
        return String(str).replace(/[&<>"]/g, c => ({'&':'&','<':'<','>':'>','"':'"'}[c]));
      }

      loadReports();
    })();
  </script>
</body>
</html>
