<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    >

    <title>User Login | UrbanPulse</title>

    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <header class="navbar">
      <a class="brand" href="index.html">
        Urban<span>Pulse</span>
      </a>

      <nav>
        <a href="index.html">Home</a>
        <a href="problems.html">Problems</a>
      </nav>
    </header>

    <main class="auth-page">
      <section class="auth-card">
        <h1>Welcome back</h1>

        <p class="subtitle">
          Sign in as a community user.
        </p>

        <p
          id="form-message"
          class="notice"
          hidden
        ></p>

        <form id="login-form">
          <div class="form-group">
            <label for="email">Email</label>

            <input
              class="form-control"
              id="email"
              name="email"
              type="email"
              required
            >
          </div>

          <div class="form-group">
            <label for="password">Password</label>

            <input
              class="form-control"
              id="password"
              name="password"
              type="password"
              required
            >
          </div>

          <button
            class="btn btn-primary"
            type="submit"
          >
            Login
          </button>
        </form>

        <p class="auth-links">
          New here?
          <a href="regis.html">Create account</a>
        </p>

        <p class="auth-links">
          Demo user: user@urbanpulse.local / User@123
        </p>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
